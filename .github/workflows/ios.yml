
name: Compilar aplicación iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para simulador iOS
        run: |
          xcodebuild \
            -project DatosCuriososIOS.xcodeproj \
            -scheme DatosCuriososIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Guardar archivo APP
        uses: actions/upload-artifact@v4
        with:
          name: DatosCuriososIOS-app
          path: build/Build/Products/Debug-iphonesimulator/DatosCuriososIOS.app
